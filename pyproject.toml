[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-news-editor"
version = "0.1.0"
description = "Human-in-the-loop AI editorial pipeline for a Ukrainian Telegram channel about AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    # Phase 2 — ingestion. httpx is the single HTTP library; feedparser handles the
    # RSS/Atom zoo; PyYAML reads the human-editable source configuration.
    "httpx>=0.27",
    "feedparser>=6.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
ai-news = "ai_news_editor.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_news_editor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "safety: invariants protecting the human approval gate; never skip these",
]

[tool.coverage.run]
source = ["src/ai_news_editor"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "TID",  # tidy imports
    "S",    # bandit (security)
    "RUF",
]
ignore = [
    "S101",  # assert is fine in tests and internal invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["ai_news_editor"]
