# Source configuration for the AI News Editor Agent.
#
# This file is committed. It must never contain secrets.
#
# Every endpoint below was fetched and verified on 2026-08-10: each returns a parseable
# RSS 2.0 document over HTTPS with no authentication.
#
# `adapter` selects the implementation. Only `rss` exists today; `html_changelog`,
# `hn_signal` and API-backed kinds arrive in later phases and will use `options` for
# their own settings rather than being bent into an RSS shape.
#
# `trust_tier` is provenance metadata, not a truth signal. It records where a claim
# came from; the editorial layer decides what that is worth.

version: 1

defaults:
  timeout_seconds: 20
  # Several of these feeds carry a full archive (the OpenAI feed is over a thousand
  # entries). Feeds are newest-first, so a cap keeps recent items without re-ingesting
  # years of history on every run.
  max_items_per_fetch: 50
  poll_interval_minutes: 60

sources:
  - id: openai_news
    name: OpenAI News
    enabled: true
    adapter: rss
    url: https://openai.com/news/rss.xml
    trust_tier: OFFICIAL
    publisher: OpenAI
    editorial_role: >-
      Product announcements and ChatGPT features straight from the vendor. The primary
      source for "something you can use today" stories.
    tags: [product_update, chatgpt, official]

  - id: google_ai_blog
    name: Google — The Keyword (AI)
    enabled: true
    adapter: rss
    url: https://blog.google/technology/ai/rss/
    trust_tier: OFFICIAL
    publisher: Google
    editorial_role: >-
      Gemini features and consumer-facing Google AI products, written for a general
      audience rather than for engineers.
    tags: [product_update, gemini, official]

  - id: huggingface_blog
    name: Hugging Face Blog
    enabled: true
    adapter: rss
    url: https://huggingface.co/blog/feed.xml
    trust_tier: OFFICIAL
    publisher: Hugging Face
    editorial_role: >-
      Notable open-source AI developments and tools. Skews technical; Phase 4 is
      expected to filter this source hard and keep only stories with a consumer angle.
    tags: [open_source, tools, technical]

  - id: microsoft_365_blog
    name: Microsoft 365 Blog
    enabled: true
    adapter: rss
    url: https://www.microsoft.com/en-us/microsoft-365/blog/feed/
    trust_tier: OFFICIAL
    publisher: Microsoft
    editorial_role: >-
      User-facing Microsoft 365 Copilot features — AI at work, in tools people already
      have. Publishes infrequently, so expect few items per run.
    tags: [product_update, copilot, ai_for_work, official]

  - id: techcrunch_ai
    name: TechCrunch — AI
    enabled: true
    adapter: rss
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    trust_tier: REPUTABLE_SECONDARY
    publisher: TechCrunch
    editorial_role: >-
      Broader AI industry news plus the stories vendors never publish about themselves:
      controversies, failures, deepfakes, scams and viral oddities. The main supply of
      non-announcement material.
    tags: [industry, consumer, controversy, viral]

  # --- HTML changelog sources -------------------------------------------------
  # These vendors publish no usable feed, so their listing pages are read directly
  # with CSS selectors. Selectors target semantic elements (h2/h4, time, p) rather
  # than class names: both sites use build-hashed CSS-module classes that change on
  # every deploy. `min_expected_items` turns a redesign into a loud failure instead
  # of a silent zero-item "success".

  - id: anthropic_news
    name: Anthropic News
    enabled: true
    adapter: html_changelog
    url: https://www.anthropic.com/news
    trust_tier: OFFICIAL
    publisher: Anthropic
    editorial_role: >-
      Claude product announcements and company news. Anthropic publishes no public
      news feed, so the newsroom listing page is read directly.
    tags: [product_update, claude, official]
    options:
      # The newsroom has two layouts: a featured grid using headings, and a list
      # where the title sits in a span. Both are matched. The `__title` fragment is
      # the CSS-module local name, which is stable across builds — only the hash
      # around it changes.
      item_selector: 'a[href^="/news/"]'
      title_selector: 'h2, h3, h4, [class*="__title"]'
      link_selector: ':self'
      date_selector: 'time'
      summary_selector: 'p'
      min_expected_items: 3

  - id: notion_releases
    name: Notion Releases
    enabled: true
    adapter: html_changelog
    url: https://www.notion.com/releases
    trust_tier: OFFICIAL
    publisher: Notion
    editorial_role: >-
      Notion AI and product release notes — small, concrete changes in a tool many
      non-technical people use daily. No feed is published.
    tags: [product_update, notion, ai_for_work, official]
    options:
      item_selector: 'a[href^="/releases/"]'
      title_selector: 'h2'
      link_selector: ':self'
      date_from_url: '/releases/(\d{4}-\d{2}-\d{2})'
      min_expected_items: 3

  # --- Community signal -------------------------------------------------------
  # Attention only. Never provenance, never article content: signal_only sources are
  # refused by the normalizer and can only produce community_signals rows.

  - id: hackernews
    name: Hacker News (AI stories)
    enabled: true
    adapter: hn_signal
    url: https://hn.algolia.com/api/v1/search_by_date
    trust_tier: COMMUNITY_SIGNAL
    signal_only: true
    publisher: Hacker News
    editorial_role: >-
      Tells us the tech community is suddenly discussing a story, which can indicate
      virality or that something is worth investigating. It never establishes that a
      claim is true and never supplies article text.
    tags: [community, attention, signal]
    options:
      queries: ["artificial intelligence", "ChatGPT", "Claude AI", "Gemini AI"]
      window_hours: 72
      hits_per_query: 40
      min_points: 5
